<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Web BLE Chat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; background-color: #007bff; color: white; }
        button:disabled { background-color: #cccccc; }
        input { padding: 10px; font-size: 16px; width: 200px; border-radius: 5px; border: 1px solid #ccc; }
        #terminal { width: 80%; max-width: 500px; height: 200px; border: 1px solid #ccc; margin: 20px auto; padding: 10px; text-align: left; overflow-y: scroll; background: white; }
        .status { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h1>ESP32 Web BLE</h1>
    <p class="status">Status: <span id="status">Rozłączono</span></p>

    <button id="connectBtn">Połącz z ESP32</button>
    <button id="disconnectBtn" disabled>Rozłącz</button>

    <br><br>

    <input type="text" id="inputData" placeholder="Wpisz tekst do wysłania" disabled>
    <button id="sendBtn" disabled>Wyślij</button>

    <h3>Odebrane wiadomości:</h3>
    <div id="terminal"></div>

    <script>
        // Definicje UUID – muszą być identyczne jak w ESP32
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let deviceCache = null;
        let characteristicCache = null;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const inputData = document.getElementById('inputData');
        const statusText = document.getElementById('status');
        const terminal = document.getElementById('terminal');

        // Funkcja logowania do wirtualnego terminala na stronie
        function log(message) {
            const p = document.createElement('p');
            p.style.margin = "4px 0";
            p.textContent = message;
            terminal.appendChild(p);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Łączenie z urządzeniem BLE
        connectBtn.addEventListener('click', async () => {
            log("Szukanie urządzeń BLE...");
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_Web_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });

                deviceCache = device;
                statusText.textContent = "Łączenie...";
                log(`Znaleziono: ${device.name}. Łączenie z serwerem GATT...`);

                const server = await device.gatt.connect();
                log("Połączono z serwerem GATT. Pobieranie usługi...");

                const service = await server.getPrimaryService(SERVICE_UUID);
                log("Pobrano usługę. Pobieranie charakterystyki...");

                characteristicCache = await service.getCharacteristic(CHARACTERISTIC_UUID);
                log("Charakterystyka gotowa.");

                // Włączenie powiadomień (odbieranie danych z ESP32)
                await characteristicCache.startNotifications();
                characteristicCache.addEventListener('characteristicvaluechanged', handleNotifications);

                statusText.textContent = "Połączono";
                statusText.style.color = "green";
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                inputData.disabled = false;
                sendBtn.disabled = false;

                device.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                log("Błąd: " + error);
                statusText.textContent = "Błąd połączenia";
                statusText.style.color = "red";
            }
        });

        // Obsługa przychodzących danych z ESP32 (funkcja Notify)
        function handleNotifications(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const decodedString = decoder.decode(value);
            log("<- " + decodedString);
        }

        // Wysyłanie danych do ESP32
        sendBtn.addEventListener('click', async () => {
            const text = inputData.value;
            if (!text || !characteristicCache) return;

            try {
                const encoder = new TextEncoder('utf-8');
                const data = encoder.encode(text);
                await characteristicCache.writeValueWithResponse(data);
                log("-> Wysłano: " + text);
                inputData.value = "";
            } catch (error) {
                log("Błąd wysyłania: " + error);
            }
        });

        // Rozłączanie manualne
        disconnectBtn.addEventListener('click', () => {
            if (deviceCache && deviceCache.gatt.connected) {
                deviceCache.gatt.disconnect();
            }
        });

        // Reakcja na rozłączenie urządzenia
        function onDisconnected() {
            log("Urządzenie zostało rozłączone.");
            statusText.textContent = "Rozłączono";
            statusText.style.color = "black";
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            inputData.disabled = true;
            sendBtn.disabled = true;
            characteristicCache = null;
            deviceCache = null;
        }
    </script>
</body>
</html>
